<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # PHP API (the rest of the backend folder is NOT reachable from the web)
    Alias /api /var/www/backend/api
    <Directory /var/www/backend/api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Images: includes the folder the admin uploads new pictures into
    Alias /images /var/www/frontend/public/images
    <Directory /var/www/frontend/public/images>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # The React site. Unknown paths (like /admin/users) fall back to index.html so the router can handle them.
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
